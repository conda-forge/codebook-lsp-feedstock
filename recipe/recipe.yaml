context:
  version: "0.4.0"

package:
  name: codebook-lsp
  version: ${{ version }}

source:
  url: https://github.com/blopker/codebook/archive/refs/tags/v${{ version }}.zip
  sha256: 586b190260bdd7fcac91f05ec7e63f94117a908ef4a6406cad29f565bd5357fd

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
      # aws-lc-sys's default cc builder can't assemble its ARM64 sources with MSVC on win-arm64
      AWS_LC_SYS_CMAKE_BUILDER: "1"
    content:
      - if: unix
        then: |
          export CFLAGS="${CFLAGS} -D_BSD_SOURCE"
          cargo-bundle-licenses --format yaml --output ${SRC_DIR}/THIRDPARTY.yml
          cargo auditable install --locked --no-track --path ./crates/codebook-lsp --root ${PREFIX}
        else: |
          cargo-bundle-licenses --format yaml --output %SRC_DIR%\THIRDPARTY.yml
          cargo auditable install --locked --no-track --path .\crates\codebook-lsp --root %LIBRARY_PREFIX%

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - if: linux
      then: make
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script:
      - codebook-lsp --version

about:
  homepage: https://github.com/blopker/codebook
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  description: "Spell Checker for Code"
  summary: "Spell Checker for Code"

extra:
  recipe-maintainers:
    - VasanthakumarV
